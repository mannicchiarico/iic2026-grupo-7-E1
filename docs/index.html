<!doctype html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlas del Picor · Versiones</title>
<style>
:root{--bg:#fffaf9;--fg:#2b1517;--muted:#7d5f62;--line:#f0dcdc;--accent:#c62828}
@media (prefers-color-scheme:dark){:root{--bg:#1a1113;--fg:#f8eaea;--muted:#c4a5a8;--line:#3a2427;--accent:#ff6b6b}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg)}
main{max-width:640px;margin:0 auto;padding:48px 16px}
h1{margin:0 0 4px;font-size:2rem}
p{color:var(--muted);margin:0 0 32px}
ul{list-style:none;padding:0;margin:0;display:grid;gap:12px}
a{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border:1px solid var(--line);border-radius:12px;color:inherit;text-decoration:none}
a:hover{border-color:var(--accent)}
a span{color:var(--accent);font-weight:600}
</style>
</head>
